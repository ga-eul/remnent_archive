<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remnant Archive 인트로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117; --surface:#161b22; --line:#30363d;
    --text:#e6edf3; --muted:#8b949e; --dim:#5b636d;
    --accent:#3fb68b; --neon:#2ee6d6; --warn:#d1453b;
    --mono:"JetBrains Mono", ui-monospace, monospace;
    --sans:"Noto Sans KR", system-ui, sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
  button,input{font:inherit;color:inherit}
  .mono{font-family:var(--mono)}

  /* ---------- 배경 장면 ---------- */
  .scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:#05070f}
  .scene svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .6s ease}
  .scene .photo{position:absolute;right:0;top:calc((100vh - min(92vw,150vh) * 0.5631) * 0.3);width:min(92vw,150vh);height:auto;-webkit-mask-image:linear-gradient(to right,transparent,#000 7%),linear-gradient(to bottom,transparent,#000 12%,#000 86%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 7%),linear-gradient(to bottom,transparent,#000 12%,#000 86%,transparent);mask-composite:intersect;transition:opacity .6s ease}
  .scene.no-photo .photo,.scene.no-photo #fx{opacity:0}
  .scene:not(.no-photo) svg{display:none}
  .kb{position:absolute;inset:0;transform-origin:70% 55%;animation:kb 32s ease-in-out infinite alternate;will-change:transform}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.045)}}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .shade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(13,17,23,.96) 0%,rgba(13,17,23,.82) 22%,rgba(13,17,23,.4) 38%,rgba(13,17,23,0) 52%)}
  .scan{position:absolute;inset:0;pointer-events:none;opacity:.18;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
  .ph-note{position:absolute;top:20px;right:24px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    color:var(--muted);border:1px dashed var(--line);padding:6px 10px;border-radius:6px;background:rgba(13,17,23,.6);display:none}
  .scene.no-photo .ph-note{display:block}

  /* 흐르는 빛 */
  .flow{stroke-dasharray:3 16;animation:flow 4s linear infinite}
  .flow.slow{animation-duration:7s}
  @keyframes flow{to{stroke-dashoffset:-190}}
  .blink{animation:blink 5s steps(1) infinite}
  @keyframes blink{0%,92%{opacity:1}93%,96%{opacity:.15}97%{opacity:1}}

  /* ---------- 레이아웃 ---------- */
  .layout{position:relative;z-index:2;min-height:100vh;display:flex}
  .panel{width:min(580px,48vw);min-height:100vh;padding:48px 64px 28px;display:flex;flex-direction:column;gap:28px}
  .head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.32em;color:var(--accent)}
  .head h1{margin-top:14px;font-size:clamp(40px,4.6vw,60px);line-height:1.02;font-weight:900;letter-spacing:.01em;
    text-shadow:0 0 28px rgba(46,230,214,.18)}
  .slogan{margin-top:18px;font-family:var(--mono);font-size:18px;color:var(--text);min-height:1.5em}
  .caret{display:inline-block;width:9px;height:1.1em;margin-left:3px;vertical-align:-3px;background:var(--accent);animation:caret 1s steps(1) infinite}
  @keyframes caret{50%{opacity:0}}
  .sub{margin-top:8px;font-size:15px;color:var(--muted)}
  .sub em{font-style:normal;color:var(--accent)}

  /* 메뉴 */
  .menu{display:flex;flex-direction:column;gap:4px}
  .item{display:flex;align-items:baseline;gap:14px;width:100%;padding:12px 20px;border:1px solid transparent;border-radius:8px;
    background:none;cursor:pointer;text-align:left;transition:background .2s,border-color .2s}
  .item .ko{font-size:21px;font-weight:700;white-space:nowrap}
  .item .en{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted);white-space:nowrap}
  .item .tag{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
  .item.primary{border-color:rgba(63,182,139,.55);background:rgba(63,182,139,.08)}
  .item.primary .ko{color:#fff}
  .item:hover,.item:focus-visible{outline:none;border-color:var(--accent);background:rgba(63,182,139,.12)}
  .item[aria-disabled="true"] .ko{color:var(--dim)}
  .item[aria-disabled="true"]:hover,.item[aria-disabled="true"]:focus-visible{border-color:var(--line);background:rgba(255,255,255,.03)}
  .item .tag.warn{color:var(--warn);border-color:rgba(209,69,59,.5)}

  /* 사원 조회 */
  .lookup .label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:10px}
  .field{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:rgba(22,27,34,.7);max-width:400px}
  .field input{flex:1;min-width:0;background:none;border:0;padding:12px 14px;font-size:15px;outline:none}
  .field input::placeholder{color:var(--dim)}
  .field button{border:0;border-left:1px solid var(--line);background:none;padding:0 18px;font-size:14px;color:var(--accent);cursor:pointer}
  .field:focus-within{border-color:var(--accent)}
  .field button:hover,.field button:focus-visible{outline:none;background:rgba(63,182,139,.12)}
  .result{margin-top:12px;min-height:44px;font-family:var(--mono)}
  .result .big{font-size:20px;letter-spacing:.02em}
  .result .big.fail{color:#c9d1d9;font-style:italic}
    .result .small{margin-top:4px;font-size:11px;letter-spacing:.08em;color:var(--muted)}

  /* 하단 */
  .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--dim)}
  .toggles{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:none;font-size:12px;color:var(--muted);cursor:pointer}
  .chip[aria-pressed="true"]{color:var(--accent);border-color:rgba(63,182,139,.6)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hint{font-family:var(--mono);letter-spacing:.1em}
  .foot a{color:var(--muted);text-decoration:none}
  .foot a:hover{color:var(--text)}

  /* 보존 기억 카운터 */
  .counter{position:fixed;right:40px;bottom:32px;z-index:2;text-align:right;transition:all .6s;padding:12px 16px;border-radius:8px;background:rgba(13,17,23,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .counter .label{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--muted)}
  .counter .num{margin-top:6px;font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:.04em}
  .counter .num small{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:6px;font-weight:400}
  .counter .num.tick{animation:tick .5s ease}
  @keyframes tick{0%{color:var(--accent)}100%{color:var(--text)}}


  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:6;opacity:0;pointer-events:none;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 18px;font-size:14px;transition:all .25s}
  .toast.show{opacity:1;transform:translate(-50%,0)}


  /* ---------- 연출 줄이기 ---------- */
  body.reduced .flow,body.reduced .blink,body.reduced .caret,body.reduced .counter .num.tick{animation:none}
  body.reduced .scan{display:none}
  body.reduced .kb{animation:none}
  @media (prefers-reduced-motion:reduce){ .flow,.blink,.caret,.kb{animation:none} }

  /* ---------- 모바일 ---------- */
  @media (max-width:767px){
    .scene{position:absolute;height:56vh}
    .scene .photo{inset:0;width:100%;height:100%;object-fit:cover;object-position:72% center;-webkit-mask-image:none;mask-image:none}
    .shade{background:linear-gradient(180deg,rgba(13,17,23,0) 30%,rgba(13,17,23,.7) 70%,var(--bg) 100%)}
    .layout{justify-content:flex-start}
    .panel{width:100%;padding:38vh max(16px, env(safe-area-inset-right,0px)) 72px max(16px, env(safe-area-inset-left,0px));gap:32px}
    .head h1{font-size:40px}
    .item{padding:14px 16px;min-height:52px}
    .item .ko{font-size:19px}
    .item .en{display:none}
    .counter{position:absolute;top:64px;right:16px;left:auto;bottom:auto;text-align:right}
    .counter .num{font-size:20px}
    .panel{padding-bottom:72px}
    .counter{top:16px}
    .ph-note{display:none!important}
  }
</style>
</head>

<script>
/* 인트로 배경 효과: 빛 입자 흐름 + 창문 깜빡임 (이미지 좌표 기준) */
(function(){
  const IW=1671, IH=941;
  // [시작, 제어점1, 제어점2, 끝], rev=true면 끝에서 시작으로(건물 쪽으로) 흐름
  const PATHS=[
    {p:[[190,655],[430,420],[820,240],[1140,265]],rev:false},
    {p:[[300,640],[420,540],[650,500],[890,490]],rev:false},
    {p:[[220,650],[400,470],[700,450],[890,470]],rev:false},
    {p:[[300,685],[430,605],[700,600],[905,660]],rev:false},
    {p:[[905,690],[880,560],[880,400],[990,345]],rev:false},
    {p:[[990,345],[1040,300],[1100,270],[1140,265]],rev:false},
    {p:[[1290,10],[1210,100],[1160,180],[1140,265]],rev:false},
    {p:[[1460,0],[1380,60],[1340,120],[1328,185]],rev:false},
    {p:[[1640,160],[1580,80],[1420,90],[1328,185]],rev:false},
    {p:[[420,815],[600,805],[800,800],[1050,790]],rev:false},
    {p:[[1060,941],[1080,870],[1160,820],[1220,775]],rev:false},
    {p:[[1180,941],[1150,880],[1200,820],[1240,775]],rev:false},
    {p:[[440,941],[600,880],[850,840],[1100,800]],rev:false},
    {p:[[0,840],[150,832],[300,822],[420,815]],rev:false}
  ];
  const WINS=[[1050,420,30,10],[1400,330,30,10],[1450,450,30,10],[1060,560,30,10],[1380,560,30,10]];
  const cv=document.getElementById('fx'), ctx=cv.getContext('2d'), photo=document.getElementById('photo');
  let W=0,H=0,sc=1,ox=0,oy=0,running=false,raf=0,last=0;
  const parts=[];
  PATHS.forEach((path,i)=>{ const n=i<9?2:1; for(let k=0;k<n;k++) parts.push({path,t:Math.random(),v:.05+Math.random()*.05}); });
  let flick=null, nextFlick=performance.now()+2500;

  function bz(p,t){const u=1-t;return[u*u*u*p[0][0]+3*u*u*t*p[1][0]+3*u*t*t*p[2][0]+t*t*t*p[3][0],u*u*u*p[0][1]+3*u*u*t*p[1][1]+3*u*t*t*p[2][1]+t*t*t*p[3][1]];}
  function layout(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    W=cv.clientWidth; H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const cs=getComputedStyle(photo);
    if(cs.objectFit==='cover'){
      sc=Math.max(W/IW,H/IH);
      const pos=(cs.objectPosition||'50% 50%').split(' ').map(v=>parseFloat(v)/100);
      ox=(W-IW*sc)*(isNaN(pos[0])?.5:pos[0]); oy=(H-IH*sc)*(isNaN(pos[1])?.5:pos[1]);
    } else { sc=photo.offsetWidth/IW; ox=photo.offsetLeft; oy=photo.offsetTop; }
  }
  function map(x,y){return[ox+x*sc,oy+y*sc];}
  function dot(x,y,r,a){
    const g=ctx.createRadialGradient(x,y,0,x,y,r*4);
    g.addColorStop(0,'rgba(220,255,250,'+a+')'); g.addColorStop(.25,'rgba(46,230,214,'+(a*.7)+')'); g.addColorStop(1,'rgba(46,230,214,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*4,0,Math.PI*2); ctx.fill();
  }
  function frame(now){
    if(!running) return;
    const dt=Math.min((now-(last||now))/1000,.05); last=now;
    ctx.clearRect(0,0,W,H);
    // 창문 깜빡임
    if(!flick && now>nextFlick){ flick={w:WINS[Math.floor(Math.random()*WINS.length)],end:now+250+Math.random()*450,blinks:Math.random()<.5}; }
    if(flick){
      const on = flick.blinks ? Math.floor((flick.end-now)/90)%2===0 : true;
      if(on){ const [x,y]=map(flick.w[0],flick.w[1]); ctx.fillStyle='rgba(8,14,26,.82)'; ctx.fillRect(x,y,flick.w[2]*sc,flick.w[3]*sc); }
      if(now>flick.end){ flick=null; nextFlick=now+3000+Math.random()*5000; }
    }
    // 빛 입자
    ctx.globalCompositeOperation='lighter';
    const r=Math.max(1.4,2.2*sc);
    for(const q of parts){
      q.t+=q.v*dt; if(q.t>1) q.t-=1;
      const fade=Math.sin(Math.PI*q.t);
      for(let k=0;k<6;k++){
        let tt=q.t-k*.012; if(tt<0) continue;
        const T=q.path.rev?1-tt:tt; const [x,y]=map(...bz(q.path.p,T));
        dot(x,y,r*(1-k*.12),.9*fade*(1-k/6));
      }
    }
    ctx.globalCompositeOperation='source-over';
    raf=requestAnimationFrame(frame);
  }
  function start(){ if(running) return; running=true; last=0; layout(); raf=requestAnimationFrame(frame); }
  function stop(){ running=false; cancelAnimationFrame(raf); ctx.clearRect(0,0,cv.width,cv.height); }
  let st={reduced:false};
  function sync(S){ if(S) st=S; const ok=!st.reduced && photo.complete && photo.naturalWidth>0 && !document.hidden; ok?start():stop(); }
  window.__fxSync=sync;
  photo.addEventListener('load',()=>sync());
  window.addEventListener('resize',()=>{ if(running) layout(); });
  document.addEventListener('visibilitychange',()=>sync());
})();
</script>

  photo.addEventListener('error', ()=>{
    if (photo.src.indexOf('data:') !== 0){ photo.src = EMBEDDED_INTRO; return; }
    scene.classList.add('no-photo');
  });
  if (photo.complete && photo.naturalWidth === 0 && photo.src.indexOf('data:') !== 0) photo.src = EMBEDDED_INTRO;
  if (photo.complete && photo.naturalWidth > 0) scene.classList.remove('no-photo');

  /* 슬로건 타이핑 */
  let typeToken = 0;
  function typeSlogan(){
    const el = document.getElementById('type');
    const text = 'Nothing Is Ever Lost.';
    const my = ++typeToken;
    if (S.reduced){ el.textContent = text; return; }
    el.textContent = '';
    let i = 0;
    (function step(){
      if (my !== typeToken) return;
      el.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(step, 75);
    })();
  }

  /* 보존 기억 카운터: 천천히 늘어남 */
  let count = 1204331;
  const countEl = document.getElementById('count');
  const numEl = countEl.parentElement;
  function fmt(n){ return n.toLocaleString('ko-KR'); }
  (function tick(){
    setTimeout(()=>{
      count += 1;
      countEl.textContent = fmt(count);
      if (!S.reduced){ numEl.classList.remove('tick'); void numEl.offsetWidth; numEl.classList.add('tick'); }
      tick();
    }, 2500 + Math.random()*4000);
  })();

  /* 토스트 */
  let tTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(tTimer);
    tTimer = setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }

  /* 상태 적용 */
  function apply(){
    body.classList.toggle('reduced', S.reduced);
    document.getElementById('motion').setAttribute('aria-pressed', String(S.reduced));
    typeSlogan();
    if (window.__fxSync) window.__fxSync(S);
  }

  /* 메뉴 클릭 + 키보드 이동 */
  const items = [...document.querySelectorAll('.item')];
  items.forEach(btn => btn.addEventListener('click', ()=>{
    if (btn.getAttribute('aria-disabled') === 'true'){ toast(btn.dataset.why); return; }
    if (btn.dataset.href && LIVE_LINKS){ location.href = btn.dataset.href; return; }
    toast('시안: ' + btn.dataset.go + ' 화면으로 이동합니다');
  }));
  document.getElementById('menu').addEventListener('keydown', e=>{
    const i = items.indexOf(document.activeElement);
    if (i < 0) return;
    if (e.key === 'ArrowDown'){ e.preventDefault(); items[(i+1) % items.length].focus(); }
    if (e.key === 'ArrowUp'){ e.preventDefault(); items[(i-1+items.length) % items.length].focus(); }
  });

  /* 사원 조회 */
  document.getElementById('lookup').addEventListener('submit', e=>{
    e.preventDefault();
    const q = document.getElementById('q').value.trim();
    const out = document.getElementById('result');
    if (!q){ out.innerHTML = '<p class="small">이름을 입력해 주세요.</p>'; return; }
    const safe = q.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    out.innerHTML = '<p class="small">"' + safe + '" 조회 중…</p>';
    setTimeout(()=>{
      out.innerHTML = '<p class="big fail">No Results Found</p><p class="small">등록된 사원 정보가 없습니다.</p>';
    }, S.reduced ? 0 : 700);
  });

  /* 하단 토글 */
  document.getElementById('sound').addEventListener('click', e=>{
    S.sound = !S.sound;
    e.currentTarget.setAttribute('aria-pressed', String(S.sound));
    e.currentTarget.textContent = S.sound ? '소리 켜짐' : '소리 꺼짐';
  });
  document.getElementById('motion').addEventListener('click', ()=>{ S.reduced = !S.reduced; apply(); });

  apply();
  items[0].focus({preventScroll:true});
})();
</script>
