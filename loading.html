  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at center, #10312e 0%, #081715 48%, #040909 84%);
      color: #befff5;
      font: 1rem "JetBrains Mono", ui-monospace, monospace;   /* 게임·허브와 같은 글꼴 */
    }
    .loader { width: min(94vw, 980px); text-align: center; }
    .panel { position: relative; }
    .frame {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 9px #4de8cc42);
    }
    /* The clear interior of the PNG spans x=199–2357 and y=225–332. */
    .track {
      position: absolute;
      inset: 46.012% 11.624% 32.106% 7.462%;
      overflow: hidden;
      background: #071a18;
      box-shadow: inset 0 0 10px #020b0a;
    }
    .fill-area {
      position: absolute;
      inset: 13% 0.65%;
      overflow: hidden;
    }
    .fill {
      width: 100%;
      height: 100%;
      clip-path: inset(0 calc((1 - var(--progress, 0)) * 100%) 0 0);
      background: #fff;
    }
    .head {
      position: absolute;
      inset-block: 0;
      left: calc(var(--progress, 0) * 100%);
      width: 2px;
      background: #dbfff7;
      box-shadow: 0 0 12px 3px #7fffe7;
      opacity: 0;
    }
    .running .head { opacity: 1; }
    .count {
      position: absolute;
      top: 27%;
      margin: 0;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: clamp(.65rem, 2.4vw, 1.65rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: .12em;
      text-shadow: 0 0 16px #6bffe674;
    }
    .count-left { left: 10%; }
    .count-right { left: 86.5%; }
    .complete .frame { animation: settle 320ms ease-out; }
    @keyframes settle {
      from { filter: drop-shadow(0 0 16px #78ffe0c0); }
      to { filter: drop-shadow(0 0 9px #4de8cc42); }
    }
    .reduced .complete .frame { animation: none; }
    .reduced .head { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .complete .frame { animation: none; }
      .head { display: none; }
    }
  </style>

  </main>
  <script>
    const duration = 3000;
    const loader = document.querySelector(".loader");
    const track = document.querySelector(".track");
    const counts = document.querySelectorAll(".count");
    const frame = document.querySelector(".frame");
    const next = loader.dataset.next.trim();
    /* 연출 줄이기: 허브에서 정한 값(remnant.global.settings.reduced)이 있으면 그것을, 없으면 기기 설정 */
    const savedReduced = (() => { try { return ((JSON.parse(localStorage.getItem("remnant.global") || "{}") || {}).settings || {}).reduced; } catch (e) { return undefined; } })();
    const reducedMotion = { matches: typeof savedReduced === "boolean" ? savedReduced : matchMedia("(prefers-reduced-motion: reduce)").matches };
    if (reducedMotion.matches) document.body.classList.add("reduced");

    function showProgress(progress) {
      const percent = Math.floor(progress * 100);
      track.style.setProperty("--progress", progress);
      track.setAttribute("aria-valuenow", percent);
      for (const count of counts) count.textContent = percent + "%";
    }

    function play() {
      showProgress(0);
      let start;

      function update(now) {
        start ??= now;
        const time = Math.min((now - start) / duration, 1);
        // Ease in at first, then accelerate through the final stretch.
        const progress = time * (0.68 + 0.32 * time);
        showProgress(progress);
        loader.classList.toggle("running", time > 0 && time < 1);
        if (time < 1) {
          requestAnimationFrame(update);
          return;
        }

        loader.classList.add("complete");
        if (next) {
          setTimeout(() => location.replace(next), reducedMotion.matches ? 0 : 320);
        }
      }

      requestAnimationFrame(update);
    }

    frame.decode().catch(() => {}).then(play);
  </script>
