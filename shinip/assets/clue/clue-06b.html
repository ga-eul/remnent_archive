<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기억 데이터 이전 명령 및 대상자 명단</title>
  <link rel="stylesheet" href="clue-document.css">
</head>
<body style="margin: 0; padding: clamp(12px, 3vw, 38px); background: #090f11;">
  <article class="ra-document" aria-labelledby="document-title">
    <header>
      <div class="ra-brand"><span class="ra-mark" aria-hidden="true"></span><span>REMNANT<br>ARCHIVE</span></div>
      <div class="ra-heading">
        <h1 class="ra-title" id="document-title"><span class="ra-title-en" lang="en">MEMORY DATA TRANSFER</span><span class="ra-title-ko">기억 데이터 이전 명령 및 대상자 명단</span></h1>
        <div class="ra-meta">06-B<span class="ra-status">내부 집행 문서</span></div>
      </div>
    </header>
    <section aria-labelledby="transfer-order">
      <h2 id="transfer-order">이전 명령</h2>
      <p>첨부 명단에 기재된 절차 번호와 대상자 사원번호를 대조한 뒤 기억 데이터 이전을 진행한다. 두 항목 중 하나라도 일치하지 않을 경우 이전을 보류하고 명단을 재확인한다.</p>
    </section>
    <section aria-labelledby="transfer-roster">
      <h2 id="transfer-roster">첨부 · 이전 대상자 명단</h2>
      <table aria-labelledby="transfer-roster">
        <thead>
          <tr><th scope="col">절차 번호<small lang="en">PROCEDURE ID</small></th><th scope="col">이전 대상자 사원번호<small lang="en">EMP. NO.</small></th></tr>
        </thead>
        <tbody>
          <tr><td>HUMAN-04</td><td>DA-A</td></tr>
        </tbody>
      </table>
    </section>
    <section aria-labelledby="processing-record">
      <h2 id="processing-record">처리 기록</h2>
      <p>이전 결과는 집행 후 별도 기록에 남긴다.</p>
    </section>
    <footer class="ra-footer">제한구역 · 내부 집행 문서</footer>
  </article>
</body>
</html>
